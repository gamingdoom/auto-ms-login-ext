<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    </head>

    <body>
        <div class="box">
            <p class="title is-4">Auto Microsoft Login Config</p>

            <div class="field">
                <label class="label">TOTP Secret</label>
                <p class="help is-link" id="help_text" style="display: none;">TOTP secret must be 16 characters long.</p>
                <div class="control">
                    <input class="input" type="password" id="2fa_secret" placeholder="Enter TOTP Secret">
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button id="save" class="button is-link" disabled>Save</button>
                </div>

                <p class="help is-success" id="success_text" style="display: none;">TOTP secret successfully saved!</p>
            </div>
        </div>
    </body>

    <script src="config.js"></script>
</html>
